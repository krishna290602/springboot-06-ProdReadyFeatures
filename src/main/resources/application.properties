spring.application.name=sb_04_01_BasicSetup

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
# create then update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

server.port=9000

employeeService.base.url = http://localhost:8080/

# Logging
logging.level.com/springboot/sb_04_01_BasicSetup/clients = TRACE
#logging.pattern.console=%d [%c] --- %m/%n
logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] [%c{2.}] --- %m/%n
logging.file.name=application.log
logging.config=classpath:logback-spring.xml