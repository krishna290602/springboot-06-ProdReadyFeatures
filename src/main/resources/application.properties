spring.application.name=sb_04_01_BasicSetup

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
# create then update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

server.port=9000

employeeService.base.url = http://localhost:8080/

# Logging
logging.level.com/springboot/sb_04_01_BasicSetup/clients = TRACE
#logging.pattern.console=%d [%c] --- %m/%n
logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] [%c{2.}] --- %m/%n
logging.file.name=application.log
logging.config=classpath:logback-spring.xml

#Actuator Configurations
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.author=Krishna
info.app.documentation=https://chatgpt.com/c/6a9434af-2520-83e8-ae82-c6823c0b92e2
management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# open api and swagger configurations
#springdoc.api-docs.enabled=false

